<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הכסף שלי</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הכסף שלי">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --ink:#000000; --muted:#8A8A8E; --sep:rgba(60,60,67,.2);
  --fill:rgba(118,118,128,.12); --seg-on:#FFFFFF; --tint:#007AFF;
  --exp:#E0352B; --inc:#248A3D; --track:#E3E3E8;
  --sheet:#F2F2F7; --key:#FFFFFF; --keyshadow:0 1px 0 rgba(0,0,0,.28);
  --bar:rgba(249,249,251,.86); --scrim:rgba(0,0,0,.32);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Segoe UI",Arial,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --cell:#1C1C1E; --ink:#FFFFFF; --muted:#8E8E93; --sep:rgba(84,84,88,.55);
    --fill:rgba(118,118,128,.24); --seg-on:#636366; --tint:#0A84FF;
    --exp:#FF453A; --inc:#30D158; --track:#2C2C2E;
    --sheet:#1C1C1E; --key:#4A4A4D; --keyshadow:0 1px 0 rgba(0,0,0,.5);
    --bar:rgba(22,22,24,.86); --scrim:rgba(0,0,0,.5); color-scheme:dark;
  }
  :root:not([data-theme="light"]) .sheet .group{background:#2C2C2E}
}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --ink:#FFFFFF; --muted:#8E8E93; --sep:rgba(84,84,88,.55);
  --fill:rgba(118,118,128,.24); --seg-on:#636366; --tint:#0A84FF;
  --exp:#FF453A; --inc:#30D158; --track:#2C2C2E;
  --sheet:#1C1C1E; --key:#4A4A4D; --keyshadow:0 1px 0 rgba(0,0,0,.5);
  --bar:rgba(22,22,24,.86); --scrim:rgba(0,0,0,.5); color-scheme:dark;
}
:root[data-theme="dark"] .sheet .group{background:#2C2C2E}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.3;letter-spacing:-.2px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate;direction:ltr;display:inline-block}
.inc-c{color:var(--inc)} .exp-c{color:var(--exp)}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

main{max-width:560px;margin:0 auto;padding:0 16px calc(140px + env(safe-area-inset-bottom,0px))}

/* nav */
.navrow{display:flex;align-items:center;height:44px;margin:0 -8px}
.navbtn{height:44px;min-width:44px;display:grid;place-items:center;color:var(--tint);font-size:24px;padding:0 8px}
.navbtn.txt{font-size:17px}
.navrow .sp{flex:1}
h1{margin:0 0 10px;font-size:32px;font-weight:700;letter-spacing:.2px;line-height:1.15}
h1 button{text-align:start}

.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;position:relative}
.seg button{flex:1;height:30px;border-radius:7px;font-size:13px;font-weight:500;position:relative;z-index:1}
.seg button[aria-pressed="true"]{background:var(--seg-on);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}

/* backup notice */
.notice{display:flex;align-items:center;gap:12px;margin:12px 0 0;padding:10px 14px;background:var(--cell);border-radius:10px;font-size:15px}
.notice span{flex:1;color:var(--muted)}
.notice button{color:var(--tint);font-weight:600}

/* ring */
.ringwrap{position:relative;width:min(100%,370px);aspect-ratio:1;margin:8px auto 0;touch-action:pan-y}
#ring{position:absolute;inset:0;width:100%;height:100%}
#ring .seg-a{transition:stroke-dasharray .4s ease,stroke-dashoffset .4s ease}
.bub{position:absolute;width:12.6%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.bub svg.i{width:52%;height:52%}
.bub:active{opacity:.6}
.bub.zero{background:var(--fill);color:var(--c)}
.bub .pct{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;direction:ltr;font-variant-numeric:tabular-nums}
.bub.more{background:var(--fill);color:var(--ink);font-size:13px;font-weight:600}
.center{position:absolute;left:50%;top:50%;width:40%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.center .c-lbl{font-size:13px;font-weight:600}
.center .c-main{font-size:clamp(19px,6.3vw,26px);font-weight:700;margin:1px 0 3px;letter-spacing:-.4px}
.center .c-sub{font-size:13px;color:var(--muted)}

/* grouped lists */
.group{background:var(--cell);border-radius:10px;overflow:hidden}
.gap{height:20px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 16px;text-align:start;position:relative}
.row + .row::before,.row + .rowwrap::before,.rowwrap + .row::before,.rowwrap + .rowwrap::before{content:"";position:absolute;top:0;left:0;right:var(--inset,16px);border-top:.5px solid var(--sep)}
.rowwrap{position:relative}
.row .lbl{flex:1}
.row .val{color:var(--muted)}
.chev{color:var(--muted);opacity:.6;font-size:13px}
.chev svg.i{transform:scaleX(-1)}
.ic{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.ic svg.i{width:17px;height:17px}

.crow{padding-top:9px;padding-bottom:9px;--inset:58px}
.crow .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.crow .top{display:flex;justify-content:space-between;gap:8px}
.crow .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .bot{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.crow .bar{flex:1;height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.crow .bar i{display:block;height:100%;background:var(--c)}
.sub-list{background:var(--bg);margin:0 0 0;padding:4px 0}
.sub-list .tx{background:transparent}
.tx{padding-top:8px;padding-bottom:8px;--inset:58px}
.tx .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.tx .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayh{display:flex;justify-content:space-between;padding:18px 16px 6px;font-size:13px;color:var(--muted)}
.dayh:first-child{padding-top:4px}
.empty{padding:28px 20px;text-align:center;color:var(--muted);font-size:15px}
.empty b{display:block;color:var(--ink);font-size:17px;font-weight:600;margin-bottom:4px}
.empty button{margin-top:12px;color:var(--tint);font-weight:600}
.foot{font-size:13px;color:var(--muted);padding:7px 16px 0}
.search{width:100%;height:36px;margin:0 0 12px;padding:0 12px;border-radius:10px;border:0;background:var(--fill);font-size:17px}
.search::placeholder{color:var(--muted)}

/* toolbar */
.toolbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.toolbar .in{max-width:528px;margin:0 auto;display:flex;gap:10px}
.toolbar .in button{flex:1;height:50px;border-radius:12px;color:#fff;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.toolbar .in button:active{opacity:.75}
.toolbar .in svg.i{width:20px;height:20px;stroke-width:2.4}
.b-exp{background:var(--exp)} .b-inc{background:var(--inc)}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
.sheet{position:relative;width:100%;max-width:560px;max-height:calc(100% - 12px - env(safe-area-inset-top,0px));overflow:auto;background:var(--sheet);
  border-radius:12px 12px 0 0;padding:6px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.sheet::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto 4px}
.sheet-wrap.on .scrim{opacity:1} .sheet-wrap.on .sheet{transform:none}
.sheet.alert{background:transparent;padding:0 8px calc(8px + env(safe-area-inset-bottom,0px))}
.sheet.alert::before{display:none}
.alert .group{background:var(--cell);margin-bottom:8px;border-radius:13px}
.alert .head{padding:14px 16px;text-align:center;font-size:13px;color:var(--muted)}
.alert .head b{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
.alert .act{display:block;width:100%;height:56px;font-size:20px;color:var(--tint);border-top:.5px solid var(--sep)}
.alert .act.danger{color:var(--exp)} .alert .act.cancel{font-weight:600;border:0}
.snav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;margin-bottom:8px}
.snav .l{justify-self:start;color:var(--tint)} .snav .r{justify-self:end;color:var(--tint);font-weight:600}
.snav .r.danger{color:var(--exp);font-weight:400}
.snav .ttl{font-weight:600}
.snav .seg{width:180px}

.amount{text-align:center;font-size:52px;font-weight:300;letter-spacing:-1px;margin:6px 0 14px;direction:ltr;font-variant-numeric:tabular-nums}
.amount small{font-size:30px;color:var(--muted);margin-right:4px}
.dateval{position:relative;color:var(--muted)}
.dateval input{position:absolute;inset:-10px -20px;opacity:0;width:auto}
.note{flex:1;border:0;background:transparent;font-size:17px;height:44px;padding:0;outline:none}
.note::placeholder{color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;direction:ltr;margin-top:12px}
.keypad button{height:48px;border-radius:6px;background:var(--key);box-shadow:var(--keyshadow);font-size:25px;display:grid;place-items:center}
.keypad button.fn{background:transparent;box-shadow:none}
.keypad button:active{background:var(--fill)}
.keypad svg.i{width:26px;height:26px;stroke-width:1.6}
.cta{display:block;width:100%;height:50px;border-radius:12px;margin-top:14px;font-size:17px;font-weight:600;color:#fff;background:var(--tint)}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;padding:6px 0 4px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;text-align:center;line-height:1.2}
.tile .ic{width:52px;height:52px}
.tile .ic svg.i{width:26px;height:26px}
.tile.add .ic{background:var(--fill);color:var(--tint)}
.tile:active{opacity:.6}

.field{flex:1;border:0;background:transparent;height:44px;font-size:17px;outline:none;padding:0}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px}
.swatches button{width:30px;height:30px;border-radius:50%;background:var(--c)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--cell),0 0 0 4px var(--c)}
.icongrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:12px}
.icongrid button{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--fill)}
.icongrid button svg.i{width:52%;height:52%}
.icongrid button[aria-pressed="true"]{background:var(--c);color:#fff}
.preview{display:flex;justify-content:center;padding:4px 0 16px}
.preview .ic{width:64px;height:64px} .preview .ic svg.i{width:32px;height:32px}
.ghdr{font-size:13px;color:var(--muted);padding:0 16px 7px;margin-top:22px}
select.field{appearance:none;-webkit-appearance:none;text-align:start;color:var(--muted)}
.mi{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;color:#fff;background:var(--c);flex:none}
.mi svg.i{width:18px;height:18px}
.row .danger{color:var(--exp)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:rgba(30,30,32,.92);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:.2s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.hidden{display:none!important}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:16px;padding:8px 8px 8px 16px}
.toast.act button{color:#64D2FF;font-weight:600;padding:4px 8px;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px;margin:0 -16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips:empty{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 12px;border-radius:17px;background:var(--cell);font-size:14px;box-shadow:0 0 0 .5px var(--sep);white-space:nowrap;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chip .ic{width:24px;height:24px}.chip .ic svg.i{width:14px;height:14px}
.chip .num{color:var(--muted)}
.chip:active{opacity:.6}
.toolbar .wrap{max-width:528px;margin:0 auto}
.notice + .notice{margin-top:8px}
.notice .tagn{color:var(--ink)}
.ins{align-items:flex-start;padding-top:11px;padding-bottom:11px}
.ins .txt{flex:1;font-size:15px;line-height:1.35}
.ins .mi{margin-top:1px}
.tagchip{color:var(--tint)}
.check{color:var(--tint);width:22px;text-align:center;font-weight:700}
.steps{counter-reset:st;margin:0;padding:0;list-style:none}
.steps li{counter-increment:st;position:relative;padding:12px 16px 12px 16px;padding-inline-start:46px;font-size:15px;line-height:1.4}
.steps li + li{border-top:.5px solid var(--sep)}
.steps li::before{content:counter(st);position:absolute;inset-inline-start:14px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--tint);color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center}
.steps code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--fill);padding:1px 5px;border-radius:5px;direction:ltr;unicode-bidi:isolate;display:inline-block}
#pager{touch-action:pan-y;will-change:transform}
h1 #plabel{display:inline-flex;align-items:center;gap:6px;font:inherit;letter-spacing:inherit}
h1 #plabel svg.i{width:18px;height:18px;color:var(--tint);stroke-width:2.4;margin-top:4px}
.ynav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.ynav b{font-size:22px;font-weight:700}
.ynav button{color:var(--tint);font-size:24px;width:44px;height:44px;display:grid;place-items:center}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid button{background:var(--fill);border-radius:12px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:3px}
.mgrid .mn{font-weight:600}
.mgrid .ma{font-size:12px;color:var(--muted);direction:ltr;font-variant-numeric:tabular-nums}
.mgrid button.now{box-shadow:inset 0 0 0 1.5px var(--tint)}
.mgrid button[aria-current="true"]{background:var(--tint);color:#fff}
.mgrid button[aria-current="true"] .ma{color:rgba(255,255,255,.85)}
.ylist .row .val{direction:ltr}
.rrow{padding-top:8px;padding-bottom:8px;--inset:58px}
.rrow .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.rrow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .s{font-size:13px;color:var(--muted)}
.rrow.paused .ic{opacity:.4}
.addbtn{color:var(--tint);font-weight:600;font-size:15px}
.tx .s svg.i{width:12px;height:12px;vertical-align:-1px;margin-inline-end:3px}
.clr{color:var(--tint);font-size:15px;margin-inline-start:10px}
/* lock */
.lock,.cover{position:fixed;inset:0;z-index:100;background:var(--bg)}
.cover{z-index:99}
.lock{display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.pinwrap{display:flex;flex-direction:column;align-items:center;text-align:center}
.pinwrap .logo{width:56px;height:56px;margin-bottom:14px}
.pinwrap .ttl{font-size:20px;font-weight:600}
.pinwrap .msg{color:var(--muted);font-size:15px;min-height:20px;margin-top:4px}
.dots{display:flex;gap:20px;margin:24px 0 36px;direction:ltr}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink)}
.dots i.on{background:var(--ink)}
.pinpad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 24px;direction:ltr}
.pinpad button{width:76px;height:76px;border-radius:50%;background:var(--fill);font-size:32px;display:grid;place-items:center}
.pinpad button:active{background:var(--sep)}
.pinpad .fn{background:transparent;font-size:16px}
.pinpad .fn svg.i{width:34px;height:34px;stroke-width:1.5}
.pinpad .fn.bio{color:var(--tint)}
.sheet .pinwrap{padding:16px 0 8px}
.lockinfo{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 8px 16px}
.lockinfo svg.i{width:56px;height:56px;stroke-width:1.4;color:var(--tint);margin-bottom:12px}
.lockinfo p{margin:0;color:var(--muted);font-size:15px;line-height:1.4}
</style>
</head>
<body>
<main>
  <div class="navrow">
    <button class="navbtn" id="menuBtn" aria-label="תפריט"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h.01M12 12h.01M16 12h.01" stroke-width="2.6"/></svg></button>
    <button class="navbtn" id="recBtn" aria-label="תנועות קבועות"><svg class="i" viewBox="0 0 24 24"><path d="M17 2.5l3 3-3 3M4 11.5V10a4.5 4.5 0 0 1 4.5-4.5H20M7 21.5l-3-3 3-3M20 12.5V14a4.5 4.5 0 0 1-4.5 4.5H4"/></svg></button>
    <button class="navbtn hidden" id="apBtn" aria-label="סנכרון Apple Pay"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg></button>
    <span class="sp"></span>
    <button class="navbtn txt hidden" id="todayBtn">היום</button>
    <button class="navbtn" id="prevBtn" aria-label="התקופה הקודמת"><svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="navbtn" id="nextBtn" aria-label="התקופה הבאה"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  </div>
  <h1><button id="plabel"></button></h1>
  <nav class="seg" id="periods">
    <button data-m="day">יום</button><button data-m="week">שבוע</button><button data-m="month">חודש</button><button data-m="year">שנה</button><button data-m="all">הכל</button>
  </nav>
  <div id="notice"></div>

  <div id="pager">
  <section class="ringwrap" id="ringwrap">
    <svg id="ring" viewBox="0 0 340 340" aria-hidden="true"></svg>
    <div id="bubbles"></div>
    <button class="center" id="center"></button>
  </section>

  <div class="group" id="balance"></div>
  <div id="insight"></div>
  <div class="gap"></div>
  <nav class="seg" id="views"><button data-v="cats">לפי קטגוריה</button><button data-v="txs">כל התנועות</button></nav>
  <div style="height:12px"></div>
  <input class="search hidden" id="search" type="search" placeholder="חיפוש, או # לחיפוש לפי תגית" autocomplete="off">
  <div class="group" id="list"></div>
  </div>
</main>

const idb={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('hakesef',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  get(k){return new Promise((res,rej)=>{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  set(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
};
const mkCat=([src,name,icon,color,kind])=>({id:uid(),src,name,icon,color,kind});
const freshState=()=>({v:2,cats:DEFAULT_CATS.map(mkCat),txs:[],rules:[],pending:[],meta:{rides:1}});
async function load(){
  try{await idb.open();S=await idb.get('state')}catch(e){idb.db=null;try{S=JSON.parse(localStorage.getItem('hakesef'))}catch(_){}}
  if(!S||!Array.isArray(S.txs))S=freshState();
  S.meta=S.meta||{};
  const moved=migrate();
  reindex();
  if(moved!==null)save();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
  return moved;
}
// brings older saved data up to date; returns number of ride transactions moved (or null if nothing changed)
function migrate(){
  let changed=false;
  if(!Array.isArray(S.rules)){S.rules=[];changed=true}
  if(!Array.isArray(S.pending)){S.pending=[];changed=true}
  for(const c of S.cats){
    if(!c.icon){const d=DEFAULT_CATS.find(x=>x[0]===c.src);c.icon=d?d[2]:'tag';if(d)c.color=d[3];changed=true}
  }
  let moved=null;
  if(!S.meta.rides){
    for(const src of['Rides-in','Rides-out'])if(!S.cats.some(c=>c.src===src))S.cats.push(mkCat(DEFAULT_CATS.find(x=>x[0]===src)));
    reindex();moved=0;
    for(const t of S.txs){const r=rideCat(t.t,t.n);if(r&&t.c!==r){t.c=r;moved++}}
    S.meta.rides=1;changed=true;
  }
  return changed?(moved??0):null;
}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(persist,120)}

  clearTimeout(saveT);
  try{if(idb.db)await idb.set('state',S);else localStorage.setItem('hakesef',JSON.stringify(S))}
  catch(e){toast('השמירה נכשלה: '+e.message)}
}

function usage(){const u=new Map();for(const t of S.txs)u.set(t.c,(u.get(t.c)||0)+1);return u}

/* ---------- period ---------- */
const UI={mode:'month',anchor:today(),ring:'exp',view:'cats',open:null,q:''};
function rangeFor(anchor){
  const a=pd(anchor);
  switch(UI.mode){
    case 'day':return[ds(a),ds(a)];
    case 'week':{const s=new Date(a);s.setDate(a.getDate()-a.getDay());const e=new Date(s);e.setDate(s.getDate()+6);return[ds(s),ds(e)]}
    case 'month':return[ds(new Date(a.getFullYear(),a.getMonth(),1)),ds(new Date(a.getFullYear(),a.getMonth()+1,0))];
    case 'year':return[`${a.getFullYear()}-01-01`,`${a.getFullYear()}-12-31`];
    default:return['0000-01-01','9999-12-31'];
  }
}
const range=()=>rangeFor(UI.anchor);
function shift(dir){
  const a=pd(UI.anchor);
  if(UI.mode==='day')a.setDate(a.getDate()+dir);
  else if(UI.mode==='week')a.setDate(a.getDate()+7*dir);
  else if(UI.mode==='month'){a.setDate(1);a.setMonth(a.getMonth()+dir)}
  else if(UI.mode==='year'){a.setDate(1);a.setFullYear(a.getFullYear()+dir)}
  else return;
  UI.anchor=ds(a);UI.open=null;render();
}
function periodLabel(){
  const[s,e]=range();
  switch(UI.mode){
    case 'day':return s===today()?'היום':fmtD(s,{weekday:'long',day:'numeric',month:'long'});
    case 'week':return`${fmtD(s,{day:'numeric',month:'short',noYear:1})} – ${fmtD(e,{day:'numeric',month:'short'})}`;
    case 'month':return fmtD(s,{month:'long',year:'numeric'});
    case 'year':return s.slice(0,4);
    default:return'כל הזמן';
  }
}
const periodWord=()=>({day:'היום',week:'השבוע',month:'החודש',year:'השנה',all:'כולל'})[UI.mode];
function periodTxs(){const[s,e]=range();return S.txs.filter(t=>t.d>=s&&t.d<=e)}
function sortDesc(arr){return arr.map((t,i)=>[t,i]).sort((x,y)=>y[0].d.localeCompare(x[0].d)||y[1]-x[1]).map(x=>x[0])}

/* ---------- render ---------- */
function render(){
  $('#plabel').innerHTML=`${esc(periodLabel())}${UI.mode==='all'?'':'<svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>'}`;
  document.querySelectorAll('#periods button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===UI.mode));
  document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===UI.view));
  const all=UI.mode==='all';
  $('#prevBtn').classList.toggle('hidden',all);$('#nextBtn').classList.toggle('hidden',all);
  $('#todayBtn').classList.toggle('hidden',all||range()[0]===rangeFor(today())[0]);
  const txs=periodTxs();
  renderNotice();renderRing(txs);renderBalance(txs);renderInsight();renderList(txs);renderChips();
  $('#apBtn').classList.toggle('hidden',!S.meta.apOn);
}
function renderNotice(){
  const el=$('#notice');let h='';
  const np=(S.pending||[]).length;
  if(np)h+=`<div class="notice"><span>${np===1?'תשלום Apple Pay אחד ממתין':`${np} תשלומי Apple Pay ממתינים`} לקטגוריה</span><button id="ntPend">סיווג</button></div>`;
  if(S.meta.tagActive)h+=`<div class="notice"><span>תגית פעילה: <span class="tagn">#${esc(S.meta.tagActive)}</span></span><button id="ntTag">סיום</button></div>`;
  const lb=S.meta.lastBackup,days=lb?Math.floor((Date.now()-lb)/864e5):null;
  if(S.txs.length&&!(lb&&days<30))h+=`<div class="notice"><span>${lb?`הגיבוי האחרון לפני ${days} ימים`:'עדיין אין גיבוי לנתונים'}</span><button id="bkNow">גיבוי</button></div>`;
  el.innerHTML=h;
  const b=$('#bkNow');if(b)b.onclick=backupJSON;
  const p=$('#ntPend');if(p)p.onclick=openPending;
  const tg=$('#ntTag');if(tg)tg.onclick=()=>{const was=S.meta.tagActive;S.meta.tagActive=null;save();render();toast(`התגית #${was} כבר לא נוספת אוטומטית`,undo(()=>{S.meta.tagActive=was;save();render()}))};
}
function renderRing(txs){
  const type=UI.ring,tot={exp:0,inc:0},by=new Map();
  for(const t of txs){tot[t.t]+=t.a;if(t.t===type)by.set(t.c,(by.get(t.c)||0)+t.a)}
  const sum=tot[type];
  const spent=[...by.entries()].sort((a,b)=>b[1]-a[1]);
  const r=82,C=2*Math.PI*r,gap=spent.length>1?2:0;let off=0,segs='';
  for(const[cid,v]of spent){
    const f=v/sum,len=Math.max(f*C-gap,.001);
    segs+=`<circle class="seg-a" cx="170" cy="170" r="${r}" fill="none" stroke="${cat(cid).color}" stroke-width="16" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 170 170)"/>`;
    off+=f*C;
  }
  $('#ring').innerHTML=`<circle cx="170" cy="170" r="${r}" fill="none" stroke="var(--track)" stroke-width="16"/>`+segs;

  const u=usage(),pool=S.cats.filter(c=>fits(c,type));
  const shown=spent.map(([id])=>catMap.get(id)).filter(Boolean);
  const rest=pool.filter(c=>!by.has(c.id)).sort((a,b)=>(u.get(b.id)||0)-(u.get(a.id)||0));
  let list=shown.concat(rest);const MAX=12;let more=false;
  if(list.length>MAX){list=list.slice(0,MAX-1);more=true}
  const n=list.length+(more?1:0),R=134;
  const pos=i=>{const a=(-90+i*360/n)*Math.PI/180;return`left:${((170+R*Math.cos(a))/340*100).toFixed(2)}%;top:${((170+R*Math.sin(a))/340*100).toFixed(2)}%`};
  let html='';
  list.forEach((c,i)=>{
    const v=by.get(c.id)||0,p=sum?v/sum*100:0,pl=v?(p<1?'<1%':Math.round(p)+'%'):'';
    html+=`<button class="bub${v?'':' zero'}" style="${pos(i)};--c:${c.color}" data-cat="${c.id}" aria-label="${esc(c.name)}${pl?' '+pl:''}, הוספת ${type==='exp'?'הוצאה':'הכנסה'}">${svg(c.icon)}${pl?`<span class="pct">${pl}</span>`:''}</button>`;
  });
  if(more)html+=`<button class="bub more" style="${pos(n-1)}" data-more="1">עוד</button>`;
  $('#bubbles').innerHTML=html;
  const other=type==='exp'?'inc':'exp';
  $('#center').innerHTML=`<span class="c-lbl ${type}-c">${type==='exp'?'הוצאות':'הכנסות'}</span><span class="c-main num">${money(tot[type])}</span><span class="c-sub">${other==='inc'?'הכנסות':'הוצאות'} <span class="num">${money(tot[other])}</span></span>`;
  $('#center').setAttribute('aria-label',`הוצאות ${money(tot.exp)}, הכנסות ${money(tot.inc)}. הקשה מחליפה את תצוגת הטבעת`);
}
function renderBalance(txs){
  let bal=0;for(const t of txs)bal+=t.t==='inc'?t.a:-t.a;
  let all=0;for(const t of S.txs)all+=t.t==='inc'?t.a:-t.a;
  const sgn=v=>`${v>0?'+':v<0?'−':''}${money(Math.abs(v))}`;
  $('#balance').innerHTML=`<div class="row"><span class="lbl">מאזן ${periodWord()}</span><span class="num ${bal>0?'inc-c':bal<0?'exp-c':''}">${sgn(bal)}</span></div>
    ${upcomingRow()}
    ${UI.mode==='all'?'':`<div class="row"><span class="lbl">יתרה מצטברת</span><span class="num val">${all<0?'−':''}${money(Math.abs(all))}</span></div>`}`;
  const up=$('#upRow');if(up)up.onclick=openRecurring;
}
function txRow(t,withDate){
  const c=cat(t.c);
  const sameNm=t.n&&t.n.trim()===c.name;
  const sub=[t.n&&!sameNm?c.name:'',withDate?fmtD(t.d,{day:'numeric',month:'short'}):''].filter(Boolean).join(', ');
  const rm=t.r?svg('repeat'):'',tg=(t.tags||[]).map(x=>`<span class="tagchip">#${esc(x)}</span>`).join(' ');
  return`<button class="row tx" data-tx="${t.id}">${ic(c)}<span class="mid"><span class="t">${esc(t.n||c.name)}</span>${sub||rm||tg?`<span class="s">${rm}${esc(sub||(rm?'קבועה':''))}${tg?(sub||rm?' ':'')+tg:''}</span>`:''}</span><span class="num ${t.t==='inc'?'inc-c':''}">${t.t==='inc'?'+':'−'}${money(t.a)}</span></button>`;
}
function renderList(txs){
  const el=$('#list');
  $('#search').classList.toggle('hidden',UI.view!=='txs');
  if(!S.txs.length){
    el.innerHTML=`<div class="empty"><b>אין עדיין תנועות</b>אפשר לייבא את הקובץ מ-Monefy או להוסיף הוצאה ראשונה.<br><button id="emptyImport">ייבוא מ-Monefy</button></div>`;
    $('#emptyImport').onclick=()=>$('#fileCsv').click();return;
  }
  if(UI.view==='cats'){
    const type=UI.ring,by=new Map();let sum=0;
    for(const t of txs)if(t.t===type){const g=by.get(t.c)||{v:0,list:[]};g.v+=t.a;g.list.push(t);by.set(t.c,g);sum+=t.a}
    const rows=[...by.entries()].sort((a,b)=>b[1].v-a[1].v);
    if(!rows.length){el.innerHTML=`<div class="empty">אין ${type==='exp'?'הוצאות':'הכנסות'} בתקופה הזו</div>`;return}
    el.innerHTML=rows.map(([cid,g])=>{
      const c=cat(cid),p=g.v/sum*100,open=UI.open===cid;
      return`<div class="rowwrap" style="--inset:58px"><button class="row crow" data-open="${cid}" aria-expanded="${open}" style="--c:${c.color}">${ic(c)}
        <span class="mid"><span class="top"><span class="nm">${esc(c.name)}</span><span class="num">${money(g.v)}</span></span>
        <span class="bot"><span class="bar"><i style="width:${Math.max(p,1).toFixed(1)}%"></i></span><span>${g.list.length} תנועות</span><span class="num" style="min-width:34px;text-align:left">${p<1?'<1':Math.round(p)}%</span></span></span></button>
        ${open?`<div class="sub-list">${sortDesc(g.list).map(t=>txRow(t,true)).join('')}</div>`:''}</div>`;
    }).join('');
  }else{
    const q=UI.q.trim().toLowerCase();let list;
    if(q){const qn=q.replace(/[₪,\s]/g,'');
      const qt=q.replace(/^#/,'');
      list=q.startsWith('#')?S.txs.filter(t=>(t.tags||[]).some(x=>x.toLowerCase().includes(qt)))
        :S.txs.filter(t=>(t.n||'').toLowerCase().includes(q)||cat(t.c).name.toLowerCase().includes(q)||(t.tags||[]).some(x=>x.toLowerCase().includes(q))||(qn&&/^\d/.test(qn)&&String(t.a).startsWith(qn)))}
    else list=txs;
    list=sortDesc(list);
    if(!list.length){el.innerHTML=`<div class="empty">${q?'אין תנועות שמתאימות לחיפוש':'אין תנועות בתקופה הזו'}</div>`;return}
    const LIM=400,cut=list.length>LIM;list=list.slice(0,LIM);
    // grouped by day: one group per date, rendered as separate inset groups
    let html='',cur=null,group=[];
    const flush=()=>{if(!group.length)return;let net=0;for(const t of group)net+=t.t==='inc'?t.a:-t.a;
      html+=`<div class="dayh"><span>${fmtD(cur,{weekday:'long',day:'numeric',month:'long'})}</span><span class="num">${net>0?'+':net<0?'−':''}${money(Math.abs(net))}</span></div><div class="group">${group.map(t=>txRow(t,false)).join('')}</div>`;group=[]};
    for(const t of list){if(t.d!==cur){flush();cur=t.d}group.push(t)}flush();
    if(cut)html+=`<div class="foot">מוצגות ${LIM} התנועות האחרונות. אפשר לצמצם בחיפוש או בבחירת תקופה.</div>`;
    el.innerHTML=html;
  }
  el.style.background=UI.view==='txs'?'transparent':'';
}

/* ---------- sheets / alerts / toast ---------- */
function sheet(html,cls=''){
  const w=document.createElement('div');w.className='sheet-wrap';
  w.innerHTML=`<div class="scrim"></div><div class="sheet ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(w);
  requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('on')));
  let closed=false;
  const api={el:w.querySelector('.sheet'),onclose:null,close(){if(closed)return;closed=true;w.classList.remove('on');setTimeout(()=>w.remove(),300);api.onclose&&api.onclose()}};
  w.querySelector('.scrim').onclick=api.close;
  return api;
}
function ask(title,msg,buttons){
  return new Promise(res=>{
    const acts=buttons.filter(b=>b.val!==false&&b.val!==null),cancel=buttons.find(b=>b.val===false||b.val===null);
    const s=sheet(`<div class="group"><div class="head"><b>${esc(title)}</b>${esc(msg||'')}</div>${acts.map((b,i)=>`<button class="act ${b.cls||''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div>
      <div class="group"><button class="act cancel" data-c>${esc(cancel?cancel.label:'ביטול')}</button></div>`,'alert');
    let val=cancel?cancel.val:null;s.onclose=()=>res(val);
    s.el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{val=acts[+b.dataset.i].val;s.close()});
    s.el.querySelector('[data-c]').onclick=s.close;
  });
}
let toastT;
function toast(msg,action){
  const t=$('#toast');
  t.innerHTML=`<span>${esc(msg)}</span>${action?`<button>${esc(action.label)}</button>`:''}`;
  t.classList.toggle('act',!!action);t.classList.add('on');
  if(action)t.querySelector('button').onclick=()=>{t.classList.remove('on','act');clearTimeout(toastT);action.fn()};
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on','act'),action?5000:2400);
}
const undo=fn=>({label:'ביטול',fn});

function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=ch;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function parseAmount(s){s=String(s).replace(/[^\d.,\-−]/g,'').replace('−','-');if(s.includes(',')&&!s.includes('.'))s=s.replace(',','.');else s=s.replace(/,/g,'');return parseFloat(s)}
function parseMonefy(text){
  const rows=parseCSV(text);if(!rows.length)return[];
  const head=rows[0].map(h=>h.trim().toLowerCase()),hasHead=head.includes('date')||head.includes('amount'),ix=n=>head.indexOf(n);
  const I=hasHead?{d:ix('date'),acc:ix('account'),c:ix('category'),a:ix('amount'),n:ix('description')}:{d:0,acc:1,c:2,a:3,n:7};
  const body=hasHead?rows.slice(1):rows;
  let dmy=false;
  for(const r of body){const m=(r[I.d]||'').match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);if(m&&+m[1]>12){dmy=true;break}if(m&&+m[2]>12)break}
  const out=[];
  for(const r of body){
    const raw=(r[I.d]||'').trim();let d=null,m;
    if((m=raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))d=`${m[1]}-${pad(m[2])}-${pad(m[3])}`;
    else if((m=raw.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/))){const y=m[3].length===2?'20'+m[3]:m[3];d=`${y}-${pad(dmy?m[2]:m[1])}-${pad(dmy?m[1]:m[2])}`}
    const a=parseAmount(r[I.a]);
    if(!d||!isFinite(a)||a===0)continue;
    out.push({d,a:Math.abs(a),t:a<0?'exp':'inc',cat:(r[I.c]||'').trim()||'ללא קטגוריה',n:I.n>=0?(r[I.n]||'').trim():'',acc:I.acc>=0?(r[I.acc]||'').trim():''});
  }
  return out;
}
function resolveCat(name,t){

  let c=m.find(x=>fits(x,t))||m[0];
  if(!c){const def=DEFAULT_CATS.find(x=>x[0].toLowerCase()===k);
    c=def?mkCat(def):{id:uid(),src:name,name,icon:'tag',color:PALETTE[S.cats.length%PALETTE.length],kind:t};
    S.cats.push(c);catMap.set(c.id,c)}

  return c.id;
}
async function importCSV(file){

  if(!rows.length){toast('לא נמצאו תנועות בקובץ');return}
  let mode='replace';
  if(S.txs.length){
    mode=await ask('ייבוא מ-Monefy',`בקובץ ${nf.format(rows.length)} תנועות, ובאפליקציה כבר יש ${nf.format(S.txs.length)}.`,
      [{label:'הוספת התנועות החדשות בלבד',val:'merge'},{label:'החלפת כל התנועות',val:'replace',cls:'danger'},{label:'ביטול',val:null}]);
    if(!mode)return;
  }
  const sig=(d,t,a,c,n)=>`${d}|${t}|${a}|${c}|${n}`,have=new Map();
  if(mode==='merge')for(const t of S.txs){const k=sig(t.d,t.t,t.a,t.c,t.n||'');have.set(k,(have.get(k)||0)+1)}

    if(have.get(k)>0){have.set(k,have.get(k)-1);continue}

function showLock(){

    onBio:()=>tryBio(false),

      if(Date.now()<LOCK.until){LOCK.pad.shake(`נסה שוב בעוד ${Math.ceil((LOCK.until-Date.now())/1000)} שניות`);return}
      if(await hashPin(p,L.salt)===L.hash){unlock();return}
      LOCK.fails++;
      if(LOCK.fails>=5){LOCK.until=Date.now()+30000*(LOCK.fails-4);LOCK.pad.shake(`קוד שגוי. נסה שוב בעוד ${30*(LOCK.fails-4)} שניות`)}

  if(!L||!L.on){
    const s=sheet(`<div class="snav"><button class="l" data-close>ביטול</button><span class="ttl">נעילה</span><span></span></div>
      <div class="lockinfo">${svg('faceid')}<p>כשהנעילה פעילה, האפליקציה נפתחת רק עם Face ID או עם קוד גיבוי בן 4 ספרות. היא ננעלת שוב כשיוצאים ממנה.</p></div>
      <button class="cta" id="lkOn">הפעלת נעילה</button>`);
    s.el.querySelector('[data-close]').onclick=s.close;
    s.el.querySelector('#lkOn').onclick=()=>{s.close();setPin('בחירת קוד גיבוי',async pin=>{
      const salt=b64u(rand(16));
      S.meta.lock={on:true,salt,hash:await hashPin(pin,salt),cred:null,grace:60};await persist();
      const can=await bioAvailable();
      if(!can){toast('הנעילה הופעלה עם קוד. Face ID לא זמין כאן');return}
      const a=sheet(`<div class="lockinfo" style="padding-top:20px">${svg('faceid')}<p>להשתמש ב-Face ID כדי לפתוח את האפליקציה?</p></div>
        <button class="cta" id="bioYes">שימוש ב-Face ID</button><button class="cta" id="bioNo" style="background:var(--fill);color:var(--ink)">קוד בלבד</button>`);
      a.el.querySelector('#bioYes').onclick=()=>{a.close();enableBio(()=>{})};
      a.el.querySelector('#bioNo').onclick=()=>{a.close();toast('הנעילה הופעלה עם קוד')};
    })};
    return;
  }
  const g=L.grace??60;
  const s=sheet(`<div class="snav"><span></span><span class="ttl">נעילה</span><button class="r" data-close>סיום</button></div>
    <div class="group">
      <button class="row" id="lkBio"><span class="lbl">Face ID</span><span class="val">${L.cred?'פעיל':'כבוי'}</span><span class="chev">${UI_ICON.chev}</span></button>
      <button class="row" id="lkPin"><span class="lbl">שינוי קוד הגיבוי</span><span class="chev">${UI_ICON.chev}</span></button>
    </div>
    <div class="ghdr">נעילה אחרי יציאה מהאפליקציה</div>
    <nav class="seg" id="lkGrace"><button data-g="0">מיד</button><button data-g="60">אחרי דקה</button><button data-g="300">אחרי 5 דקות</button></nav>
    <div class="gap"></div>
    <div class="group"><button class="row" id="lkOff"><span class="danger">כיבוי הנעילה</span></button></div>
    <div class="foot">הנעילה מונעת ממי שמחזיק את הטלפון לראות את הנתונים באפליקציה. היא לא מצפינה אותם. מפתח ה-Face ID נשמר באפליקציית הסיסמאות של האייפון.</div>`);
  const el=s.el;
  el.querySelector('[data-close]').onclick=s.close;
  el.querySelectorAll('#lkGrace button').forEach(b=>{b.setAttribute('aria-pressed',+b.dataset.g===g);b.onclick=()=>{L.grace=+b.dataset.g;save();el.querySelectorAll('#lkGrace button').forEach(x=>x.setAttribute('aria-pressed',x===b))}});
  el.querySelector('#lkBio').onclick=async()=>{
    if(L.cred){const ok=await ask('לכבות את Face ID?','האפליקציה תיפתח עם הקוד בלבד.',[{label:'כיבוי Face ID',val:true,cls:'danger'},{label:'ביטול',val:false}]);
      if(ok){L.cred=null;save();s.close();lockSettings()}}
    else{s.close();enableBio(()=>lockSettings())}
  };
  el.querySelector('#lkPin').onclick=()=>{s.close();setPin('קוד גיבוי חדש',async pin=>{L.salt=b64u(rand(16));L.hash=await hashPin(pin,L.salt);save();toast('הקוד עודכן')})};
  el.querySelector('#lkOff').onclick=async()=>{
    const ok=await ask('לכבות את הנעילה?','האפליקציה תיפתח בלי Face ID ובלי קוד.',[{label:'כיבוי הנעילה',val:true,cls:'danger'},{label:'ביטול',val:false}]);
    if(ok){S.meta.lock=null;save();s.close();toast('הנעילה כובתה')}
  };
}


/* ---------- recurring transactions ---------- */
const FREQ_LBL={month:'כל חודש',bimonth:'כל חודשיים',week:'כל שבוע',year:'כל שנה'};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const ruleById=id=>(S.rules||[]).find(r=>r.id===id);
function nextOcc(r,d){
  const a=pd(d),st=pd(r.start),day=st.getDate();
  if(r.freq==='week'){a.setDate(a.getDate()+7);return ds(a)}
  if(r.freq==='year'){const y=a.getFullYear()+1,m=st.getMonth();return ds(new Date(y,m,Math.min(day,dim(y,m))))}
  let y=a.getFullYear(),m=a.getMonth()+(r.freq==='bimonth'?2:1);if(m>11){m-=12;y++}
  return ds(new Date(y,m,Math.min(day,dim(y,m))));
}
const nextDue=r=>r.last?nextOcc(r,r.last):r.start;
const ended=(r,d)=>r.end&&d>r.end;
function postDue(){
  const t=today();let n=0;
  for(const r of S.rules||[]){
    if(r.paused)continue;
    let d=nextDue(r),g=0;
    while(d<=t&&!ended(r,d)&&g++<600){{const nt={id:uid(),d,a:r.a,t:r.t,c:r.c,n:r.n,r:r.id};if(r.tags&&r.tags.length)nt.tags=[...r.tags];S.txs.push(nt)}r.last=d;n++;d=nextOcc(r,d)}
  }
  if(n){S.txs.sort((x,y)=>x.d.localeCompare(y.d));save()}
  return n;
}
function skipPast(r){let d=nextDue(r),g=0;while(d<today()&&g++<600){r.last=d;d=nextOcc(r,d)}}
function countPast(r){let d=nextDue(r),n=0;while(d<today()&&!ended(r,d)&&n<600){n++;d=nextOcc(r,d)}return n}
function freqText(r){
  const st=pd(r.start);
  if(r.freq==='week')return`כל ${st.toLocaleDateString('he-IL',{weekday:'long'})}`;
  if(r.freq==='year')return`כל שנה, ${fmtD(r.start,{day:'numeric',month:'long',noYear:1})}`;
  return`${r.freq==='bimonth'?'כל חודשיים':'כל חודש'} ב-${st.getDate()}`;
}
const perMonth=r=>r.freq==='week'?r.a*52/12:r.freq==='year'?r.a/12:r.freq==='bimonth'?r.a/2:r.a;
function upcomingRow(){
  if(UI.mode!=='month')return'';
  const[s,e]=range(),t=today();if(t>e)return'';
  let net=0,n=0;
  for(const r of S.rules||[]){if(r.paused)continue;let d=nextDue(r),g=0;
    while(d<=e&&!ended(r,d)&&g++<60){if(d>t&&d>=s){net+=r.t==='inc'?r.a:-r.a;n++}d=nextOcc(r,d)}}
  if(!n)return'';
  return`<button class="row" id="upRow"><span class="lbl">קבועות שעוד צפויות ${s<=t?'החודש':'בחודש'}</span><span class="num val">${net>0?'+':net<0?'−':''}${money(Math.abs(net))}</span><span class="chev">${UI_ICON.chev}</span></button>`;
}
function suggestions(){
  const n0=new Date(),from=ds(new Date(n0.getFullYear(),n0.getMonth()-6,1)),g=new Map();
  for(const t of S.txs){if(t.d<from||t.r)continue;const k=`${t.t}|${t.c}|${(t.n||'').trim()}`;if(!g.has(k))g.set(k,[]);g.get(k).push(t)}
  const out=[];
  for(const l of g.values()){
    const months=new Set(l.map(t=>t.d.slice(0,7)));
    if(months.size<3||l.length>months.size+1)continue;
    const mean=l.reduce((a,t)=>a+t.a,0)/l.length,sd=Math.sqrt(l.reduce((a,t)=>a+(t.a-mean)**2,0)/l.length);
    if(sd/mean>.25)continue;
    const f=l[0];
    if(S.rules.some(r=>r.t===f.t&&r.c===f.c&&(r.n||'')===(f.n||'').trim()))continue;
    const last=l.reduce((a,t)=>t.d>a.d?t:a);
    const days=new Map();for(const t of l){const d=+t.d.slice(8);days.set(d,(days.get(d)||0)+1)}
    const day=[...days.entries()].sort((a,b)=>b[1]-a[1])[0][0];
    const mi=[...months].map(k=>+k.slice(0,4)*12+ +k.slice(5,7)).sort((a,b)=>a-b);
    const freq=mi.length>=3&&mi.slice(1).every((v,i)=>v-mi[i]===2)?'bimonth':'month',step=freq==='bimonth'?2:1;
    const lm=pd(last.d);let y=lm.getFullYear(),m=lm.getMonth()+step,start;
    for(let g=0;g<24;g++){const yy=y+Math.floor(m/12),mm=m%12;start=ds(new Date(yy,mm,Math.min(day,dim(yy,mm))));if(start>today())break;m+=step}
    out.push({t:f.t,c:f.c,n:(f.n||'').trim(),a:last.a,months:months.size,freq,start});
  }
  return out.sort((a,b)=>b.months-a.months||b.a-a.a).slice(0,6);
}
function openRecurring(){
  const rules=S.rules||[];
  let me=0,mi=0;for(const r of rules)if(!r.paused){if(r.t==='exp')me+=perMonth(r);else mi+=perMonth(r)}
  const row=r=>{const c=cat(r.c);return`<button class="row rrow${r.paused?' paused':''}" data-r="${r.id}">${ic(c)}<span class="mid"><span class="t">${esc(r.n||c.name)}</span><span class="s">${esc(freqText(r))}, ${r.paused?'מושהית':ended(r,nextDue(r))?'הסתיימה':'הבא: '+fmtD(nextDue(r),{day:'numeric',month:'short'})}</span></span><span class="num ${r.t==='inc'?'inc-c':''}">${r.t==='inc'?'+':'−'}${money(r.a)}</span><span class="chev">${UI_ICON.chev}</span></button>`};
  const sec=(t,ttl)=>{const l=rules.filter(r=>r.t===t).sort((a,b)=>b.a-a.a);return l.length?`<div class="ghdr">${ttl}</div><div class="group">${l.map(row).join('')}</div>`:''};
  const sug=suggestions();
  const s=sheet(`<div class="snav"><button class="l" data-close>סגירה</button><span class="ttl">תנועות קבועות</span><button class="r" data-new>הוספה</button></div>
    ${rules.length?`<div class="group">
      <div class="row"><span class="lbl">הוצאות קבועות בחודש</span><span class="num val">${money(me)}</span></div>
      <div class="row"><span class="lbl">הכנסות קבועות בחודש</span><span class="num val">${money(mi)}</span></div>
    </div>`:`<div class="empty" style="padding:18px 12px 4px"><b>אין עדיין תנועות קבועות</b>שכר דירה, חשבונות, מנויים ומשכורת יירשמו כאן לבד בכל פעם שמגיע מועדם.</div>`}
    ${sec('exp','הוצאות')}${sec('inc','הכנסות')}
    ${sug.length?`<div class="ghdr">חוזרות בנתונים שלך</div><div class="group">${sug.map((g,i)=>{const c=cat(g.c);return`<div class="row rrow">${ic(c)}<span class="mid"><span class="t">${esc(g.n||c.name)}</span><span class="s">${FREQ_LBL[g.freq]}, ${g.t==='inc'?'+':'−'}${money(g.a)}</span></span><button class="addbtn" data-s="${i}">הוספה</button></div>`}).join('')}</div>`:''}
    <div class="foot">תנועה קבועה נרשמת לבד בתאריך שלה, בפעם הבאה שפותחים את האפליקציה.</div>`);
  s.el.querySelector('[data-close]').onclick=s.close;
  s.el.querySelector('[data-new]').onclick=()=>{s.close();editRule(null)};
  s.el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{s.close();editRule(ruleById(b.dataset.r))});
  s.el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const g=sug[+b.dataset.s];s.close();editRule(null,{t:g.t,a:g.a,c:g.c,n:g.n,freq:g.freq,start:g.start})});
}
function editRule(orig,preset){
  const r=orig?{...orig}:{id:uid(),t:'exp',a:0,c:null,n:'',freq:'month',start:today(),end:null,paused:false,last:null,...(preset||{})};
  let amt=r.a?String(r.a):'';
  const posted=orig?S.txs.filter(t=>t.r===orig.id).length:0;
  const s=sheet(`
    <div class="snav"><button class="l" data-close>ביטול</button>
      <nav class="seg" id="rType"><button data-t="exp">הוצאה</button><button data-t="inc">הכנסה</button></nav>
      <button class="r" id="rSave">שמירה</button></div>
    <div class="amount" id="rAmt"></div>
    <div class="group">
      <button class="row" id="rCat"></button>
      <div class="row"><input class="note" id="rNote" placeholder="שם, למשל: שכר דירה" maxlength="120" enterkeyhint="done"></div>
    </div>
    <div class="keypad">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button data-k="${k}" class="${k==='.'||k==='⌫'?'fn':''}" aria-label="${k==='⌫'?'מחיקת ספרה':k}">${k==='⌫'?UI_ICON.back:k}</button>`).join('')}</div>
    <div class="ghdr">חזרה</div>
    <nav class="seg" id="rFreq"><button data-f="week">שבוע</button><button data-f="month">חודש</button><button data-f="bimonth">חודשיים</button><button data-f="year">שנה</button></nav>
    <div class="gap" style="height:14px"></div>
    <div class="group">
      <label class="row"><span class="lbl">${orig?'מועד ראשון':'החל מ־'}</span><span class="dateval"><span id="rStartL"></span><input type="date" id="rStart"></span></label>
      <div class="row"><label style="flex:1;display:flex;align-items:center"><span class="lbl">עד</span><span class="dateval"><span id="rEndL"></span><input type="date" id="rEnd"></span></label><button class="clr hidden" id="rEndClr">ניקוי</button></div>
    </div>
    <div class="foot" id="rFoot"></div>
    ${orig?`<div class="gap"></div><div class="group">
      <button class="row" id="rPause"><span style="color:var(--tint)">${orig.paused?'חידוש':'השהיה'}</span></button>
      <button class="row" id="rDel"><span class="danger">מחיקת התנועה הקבועה</span></button></div>
      <div class="foot">${posted?`${posted} תנועות שכבר נרשמו יישארו ברשימה גם אחרי שינוי או מחיקה.`:''}</div>`:''}`);
  const el=s.el,note=el.querySelector('#rNote'),st=el.querySelector('#rStart'),en=el.querySelector('#rEnd');
  note.value=r.n||'';st.value=r.start;en.value=r.end||'';
  const paint=()=>{
    el.querySelectorAll('#rType button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===r.t));
    el.querySelectorAll('#rFreq button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===r.freq));
    el.querySelector('#rAmt').innerHTML=`<small>₪</small>${amt?esc(amt.replace(/^(\d+)/,m=>nf.format(+m))):'0'}`;
    const c=r.c&&catMap.get(r.c);
    el.querySelector('#rCat').innerHTML=c?`<span class="lbl">קטגוריה</span>${ic(c)}<span>${esc(c.name)}</span><span class="chev">${UI_ICON.chev}</span>`:`<span class="lbl">קטגוריה</span><span class="val">בחירה</span><span class="chev">${UI_ICON.chev}</span>`;
    el.querySelector('#rStartL').textContent=r.start===today()?'היום':fmtD(r.start,{day:'numeric',month:'short',year:'numeric'});
    el.querySelector('#rEndL').textContent=r.end?fmtD(r.end,{day:'numeric',month:'short',year:'numeric'}):'ללא';
    el.querySelector('#rEndClr').classList.toggle('hidden',!r.end);
    el.querySelector('#rFoot').textContent=`${freqText(r)}.`;
  };
  paint();
  el.querySelector('[data-close]').onclick=s.close;
  el.querySelectorAll('#rType button').forEach(b=>b.onclick=()=>{r.t=b.dataset.t;if(r.c&&!fits(cat(r.c),r.t))r.c=null;paint()});
  el.querySelectorAll('#rFreq button').forEach(b=>b.onclick=()=>{r.freq=b.dataset.f;paint()});
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;let v=amt;
    if(k==='⌫')v=v.slice(0,-1);else if(k==='.'){if(!v.includes('.'))v=(v||'0')+'.'}
    else{const[i,f]=v.split('.');if(f!==undefined&&f.length>=2)return;if(f===undefined&&i.replace(/^0+/,'').length>=8)return;v=(v==='0'?'':v)+k}
    amt=v;paint();
  });
  st.onchange=()=>{if(st.value){r.start=st.value;paint()}};
  en.onchange=()=>{r.end=en.value||null;paint()};
  el.querySelector('#rEndClr').onclick=()=>{r.end=null;en.value='';paint()};
  note.addEventListener('keydown',e=>{if(e.key==='Enter')note.blur()});
  el.querySelector('#rCat').onclick=()=>pickCategory(r.t,id=>{r.c=id;paint()});
  el.querySelector('#rSave').onclick=async()=>{
    r.a=parseFloat(amt);r.n=note.value.trim();
    if(!(r.a>0)){const x=el.querySelector('#rAmt');x.classList.remove('shake');void x.offsetWidth;x.classList.add('shake');return}
    if(!r.c){pickCategory(r.t,id=>{r.c=id;paint()});return}
    if(r.end&&r.end<r.start){toast('תאריך הסיום לפני תאריך ההתחלה');return}
    if(orig){
      const sched=orig.start!==r.start||orig.freq!==r.freq;
      if(sched){const cap=orig.last;r.last=null;if(cap){let d=r.start,g=0;while(d<=cap&&g++<600){r.last=d;d=nextOcc(r,d)}}}
      Object.assign(orig,r);
    }else{
      const n=countPast(r);
      if(n){const v=await ask('לרשום גם תנועות שכבר עברו?',`מאז ${fmtD(r.start,{day:'numeric',month:'long'})} היו ${n} מועדים של התנועה הזו.`,
        [{label:`רישום ${n} התנועות`,val:'all'},{label:'רישום מהיום והלאה בלבד',val:'skip'},{label:'ביטול',val:null}]);
        if(!v)return;if(v==='skip')skipPast(r)}
      S.rules.push(r);
    }
    const n=postDue();save();s.close();render();openRecurring();
    toast(n?`נשמר, ונרשמו ${n} תנועות`:'נשמר');
  };
  if(orig){
    el.querySelector('#rPause').onclick=()=>{orig.paused=!orig.paused;if(!orig.paused)skipPast(orig);const n=postDue();save();s.close();render();openRecurring();toast(orig.paused?'התנועה הקבועה הושהתה':n?`חודשה, ונרשמו ${n} תנועות`:'התנועה הקבועה חודשה')};
    el.querySelector('#rDel').onclick=async()=>{
      const ok=await ask('למחוק את התנועה הקבועה?','תנועות שכבר נרשמו יישארו ברשימה.',[{label:'מחיקה',val:true,cls:'danger'},{label:'ביטול',val:false}]);
      if(!ok)return;const i=S.rules.indexOf(orig);S.rules.splice(i,1);save();s.close();render();openRecurring();toast('התנועה הקבועה נמחקה',undo(()=>{S.rules.splice(i,0,orig);save();render()}));
    };
  }
}

/* ---------- period picker & swipe ---------- */
function openPicker(){
  if(UI.mode==='all')return;
  const HM=['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];
  if(UI.mode==='year'){
    const ys=new Map();for(const t of S.txs){const y=t.d.slice(0,4);const o=ys.get(y)||{e:0,i:0};o[t.t==='exp'?'e':'i']+=t.a;ys.set(y,o)}
    const cy=String(cyear());if(!ys.has(cy))ys.set(cy,{e:0,i:0});
    const cur=UI.anchor.slice(0,4);
    const s=sheet(`<div class="snav"><button class="l" data-close>ביטול</button><span class="ttl">בחירת שנה</span><span></span></div>
      <div class="group ylist">${[...ys.keys()].sort().reverse().map(y=>`<button class="row" data-y="${y}"><span class="lbl" style="${y===cur?'color:var(--tint);font-weight:600':''}">${y}</span><span class="val num">−${money(ys.get(y).e)}</span></button>`).join('')}</div>`);
    s.el.querySelector('[data-close]').onclick=s.close;
    s.el.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{UI.anchor=`${b.dataset.y}-01-01`;UI.open=null;s.close();render()});
    return;
  }
  let year=pd(UI.anchor).getFullYear();
  const s=sheet(`<div class="snav"><button class="l" data-close>ביטול</button><span class="ttl">בחירת חודש</span><button class="r" data-today>היום</button></div><div id="pk"></div>`);
  const paint=()=>{
    const tot=new Array(12).fill(0);for(const t of S.txs)if(t.t==='exp'&&+t.d.slice(0,4)===year)tot[+t.d.slice(5,7)-1]+=t.a;
    const a=pd(UI.anchor),nowM=new Date();

function setupSwipe(){
  const pg=$('#pager');let sx=0,sy=0,dx=0,on=false,horiz=null,t0=0,block=false,anim=false;
  const ease='cubic-bezier(.2,.8,.2,1)';
  pg.addEventListener('touchstart',e=>{if(anim||e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;horiz=null;on=true;t0=performance.now();pg.style.transition='none'},{passive:true});
  pg.addEventListener('touchmove',e=>{
    if(!on)return;const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
    if(horiz===null){if(Math.abs(x)<10&&Math.abs(y)<10)return;horiz=Math.abs(x)>Math.abs(y)*1.2;if(!horiz){on=false;return}}
    dx=x;const k=UI.mode==='all'?.2:1;
    pg.style.transform=`translateX(${dx*k}px)`;pg.style.opacity=String(1-Math.min(Math.abs(dx)/pg.offsetWidth,1)*.4);
  },{passive:true});
  const end=()=>{
    if(!on)return;on=false;if(!horiz)return;
    block=true;setTimeout(()=>block=false,400);
    const W=pg.offsetWidth,v=Math.abs(dx)/Math.max(performance.now()-t0,1);
    if(UI.mode!=='all'&&(Math.abs(dx)>W*.22||(v>.45&&Math.abs(dx)>35))){
      const dir=dx>0?1:-1;anim=true;
      pg.style.transition=`transform .16s ease-in, opacity .16s`;pg.style.transform=`translateX(${dir*W*.6}px)`;pg.style.opacity='0';
      setTimeout(()=>{
        shift(dir);
        pg.style.transition='none';pg.style.transform=`translateX(${-dir*W*.35}px)`;
        requestAnimationFrame(()=>requestAnimationFrame(()=>{pg.style.transition=`transform .28s ${ease}, opacity .28s`;pg.style.transform='';pg.style.opacity='';setTimeout(()=>anim=false,280)}));
      },160);
    }else{pg.style.transition=`transform .25s ${ease}, opacity .25s`;pg.style.transform='';pg.style.opacity=''}
  };
  pg.addEventListener('touchend',end,{passive:true});
  pg.addEventListener('touchcancel',end,{passive:true});
  pg.addEventListener('click',e=>{if(block){e.stopPropagation();e.preventDefault()}},true);
}

/* ---------- insights ---------- */
function insights(){
  const M=v=>money(Math.round(v));
  if(UI.mode!=='month'||!S.txs.length)return[];
  const[s,e]=range(),mk=s.slice(0,7),t0=today(),isCur=t0>=s&&t0<=e,a=pd(s);
  const first=S.txs.reduce((m,t)=>!m||t.d<m?t.d:m,null).slice(0,7);
  if(mk<first||s>t0)return[];
  const prev=[];for(let i=1;i<=6;i++){const k=ds(new Date(a.getFullYear(),a.getMonth()-i,1)).slice(0,7);if(k>=first)prev.push(k)}
  const P=new Set(prev),N=prev.length,avg=new Map(),cur=new Map(),cnt=new Map();let avgTot=0,curTot=0,curInc=0,big=null;
  const day=isCur?pd(t0).getDate():dim(a.getFullYear(),a.getMonth()),dm=dim(a.getFullYear(),a.getMonth());
  const ly=`${a.getFullYear()-1}${mk.slice(4)}`;let lyTot=0,lyTo=0,lyHas=false;
  for(const t of S.txs){const k=t.d.slice(0,7);
    if(k===ly){lyHas=true;if(t.t==='exp'){lyTot+=t.a;if(+t.d.slice(8)<=day)lyTo+=t.a}}
    if(t.t==='exp'){
      if(P.has(k)){avg.set(t.c,(avg.get(t.c)||0)+t.a/N);avgTot+=t.a/N}
      if(k===mk){cur.set(t.c,(cur.get(t.c)||0)+t.a);curTot+=t.a;cnt.set(t.c,(cnt.get(t.c)||0)+1);if(!big||t.a>big.a)big=t}
    }else if(k===mk)curInc+=t.a;
  }
  const out=[],pc=(x,y)=>Math.round((x/y-1)*100);
  let over=null,under=null;
  if(N)for(const[c,av]of avg){if(av<100)continue;const v=cur.get(c)||0;
    if(isCur){if(v>av&&v-av>=100&&(!over||v-av>over.d))over={c,v,av,d:v-av}}
    else{if(v>=av*1.3&&v-av>=150&&(!over||v-av>over.d))over={c,v,av,d:v-av};if(v<=av*.6&&av-v>=150&&(!under||av-v>under.d))under={c,v,av,d:av-v}}}
  if(over)out.push({icon:cat(over.c).icon,color:cat(over.c).color,text:isCur?`על ${cat(over.c).name} כבר הוצאת החודש ${M(over.v)}, יותר מהממוצע החודשי שלך (${M(over.av)})`:`על ${cat(over.c).name} הוצאת ${M(over.v)}, ${pc(over.v,over.av)}% יותר מהממוצע החודשי שלך`});
  if(N&&avgTot>0){
    if(isCur){if(day>=7){const proj=curTot/day*dm,p=pc(proj,avgTot);
      out.push({icon:'trend',color:'#6E7781',text:Math.abs(p)>=10?`בקצב הנוכחי ההוצאות החודש יגיעו לכ-${M(Math.round(proj/10)*10)}, ${Math.abs(p)}% ${p>0?'יותר':'פחות'} מהממוצע`:`ההוצאות החודש בקצב דומה לממוצע שלך, ${M(Math.round(avgTot))}`})}}
    else{const p=pc(curTot,avgTot);if(Math.abs(p)>=8)out.push({icon:'trend',color:'#6E7781',text:`הוצאת ${M(curTot)}, ${Math.abs(p)}% ${p>0?'יותר':'פחות'} מהממוצע של ${N} החודשים שלפני`})}
  }
  if(under)out.push({icon:cat(under.c).icon,color:cat(under.c).color,text:`על ${cat(under.c).name} הוצאת רק ${M(under.v)}, לעומת ממוצע של ${M(under.av)}`});
  if(lyHas){const nm=fmtD(ly+'-01',{month:'long',year:'numeric'});
    if(isCur&&lyTo>0)out.push({icon:'repeat',color:'#3B5BDB',text:`עד היום בחודש הוצאת ${M(curTot)}, לעומת ${M(lyTo)} באותם ימים ב${nm}`});
    else if(!isCur&&lyTot>0){const p=pc(curTot,lyTot);out.push({icon:'repeat',color:'#3B5BDB',text:`לעומת ${nm}: ${Math.abs(p)}% ${p>0?'יותר':'פחות'} הוצאות (${M(lyTot)} אז)`})}}
  if(!isCur&&curInc>0){const net=curInc-curTot,r=Math.round(net/curInc*100);out.push({icon:'bank',color:net>=0?'#23944F':'#D93A3A',text:net>=0?`חסכת ${r}% מההכנסות החודש, ${M(net)}`:`ההוצאות עברו את ההכנסות ב-${M(-net)}`})}
  if(big)out.push({icon:cat(big.c).icon,color:cat(big.c).color,text:`ההוצאה הגדולה ביותר: ${big.n||cat(big.c).name}, ${M(big.a)} ב-${fmtD(big.d,{day:'numeric',month:'long',noYear:1})}`});
  const fc=[...cnt.entries()].sort((x,y)=>y[1]-x[1])[0];
  if(fc&&fc[1]>=8)out.push({icon:cat(fc[0]).icon,color:cat(fc[0]).color,text:`${fc[1]} תנועות של ${cat(fc[0]).name} החודש`});
  return out;
}

const normM=m=>String(m||'').trim().toLowerCase();
function merchantCat(m){const c=(S.meta.merchants||{})[normM(m)];return c&&catMap.has(c)?c:null}
function parseAP(text){
  const out=[];
  for(const raw of text.replace(/^\uFEFF/,'').split(/\r?\n|\u2028/)){
    const line=raw.trim();if(!line.toUpperCase().startsWith('HAKESEF|'))continue;
    const p=line.split('|');if(p.length<4)continue;
    const dRaw=p[1].trim(),am=p[2].trim(),card=p.length>=5?p[p.length-1].trim():'',m=(p.length>=5?p.slice(3,-1):p.slice(3)).join('|').trim();
    let d=null,x;
    if((x=dRaw.match(/(\d{4})-(\d{1,2})-(\d{1,2})/)))d=`${x[1]}-${pad(x[2])}-${pad(x[3])}`;
    else if((x=dRaw.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/))){const y=x[3].length===2?'20'+x[3]:x[3];d=`${y}-${pad(x[2])}-${pad(x[1])}`}
    const a=Math.abs(parseAmount(am));if(!d||!(a>0))continue;
    const fx=!/₪|ILS|ש.?ח/i.test(am)&&/[^\d\s.,\-−\u200e\u200f]/.test(am);
    out.push({key:line,d,a,m:m||'Apple Pay',card,fx,raw:am});
  }
  return out;
}
function resolvePending(){
  let n=0;const keep=[];
  for(const p of S.pending){const c=!p.fx&&merchantCat(p.m);
    if(c){const t={id:uid(),d:p.d,a:p.a,t:'exp',c,n:p.m,ap:1};if(S.meta.tagActive)t.tags=[S.meta.tagActive];S.txs.push(t);n++}else keep.push(p)}
  S.pending=keep;if(n)S.txs.sort((x,y)=>x.d.localeCompare(y.d));return n;
}
async function syncAP(file){
  let items;try{items=parseAP(await file.text())}catch(e){toast('לא הצלחתי לקרוא את הקובץ');return}
  if(!items.length){toast('לא נמצאו תשלומים. ודא שבחרת את הקובץ שהקיצור יוצר');return}
  const seen=new Set(S.meta.apSeen||[]);let fresh=0;
  for(const it of items){if(seen.has(it.key))continue;seen.add(it.key);S.pending.push({id:uid(),...it});fresh++}
  S.meta.apSeen=[...seen].slice(-5000);S.meta.apOn=1;S.meta.apLast=Date.now();
  const auto=resolvePending(),pend=S.pending.length;
  await persist();render();
  if(!fresh){toast('אין תשלומים חדשים');if(pend)openPending();return}
  toast(`נרשמו ${auto} תשלומים${pend?`, ${pend} ממתינים לקטגוריה`:''}`);
  if(pend)openPending();
}
function openPending(){
  const l=[...S.pending].sort((a,b)=>b.d.localeCompare(a.d));
  const s=sheet(`<div class="snav"><span></span><span class="ttl">תשלומי Apple Pay</span><button class="r" data-close>סיום</button></div>
    ${l.length?`<div class="group">${l.map(p=>`<button class="row rrow" data-p="${p.id}" style="--inset:58px"><span class="ic" style="--c:#1C1C1E">${svg('card')}</span><span class="mid"><span class="t">${esc(p.m)}</span><span class="s">${esc([fmtD(p.d,{day:'numeric',month:'short'}),p.card].filter(Boolean).join(', '))}</span></span><span class="num">${p.fx?esc(p.raw):'−'+money(p.a)}</span><span class="chev">${UI_ICON.chev}</span></button>`).join('')}</div>
      <div class="foot">בוחרים קטגוריה לכל בית עסק פעם אחת, ומהפעם הבאה התשלומים אצלו נרשמים לבד.</div>`
      :'<div class="empty">אין תשלומים שממתינים</div>'}`);
  s.el.querySelector('[data-close]').onclick=s.close;
  s.el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=S.pending.find(x=>x.id===b.dataset.p);s.close();if(p)openEditor({pending:p,type:'exp'})});
}
function openAPSetup(){
  const nm=Object.keys(S.meta.merchants||{}).length;
  const s=sheet(`<div class="snav"><button class="l" data-close>סגירה</button><span class="ttl">Apple Pay</span><span></span></div>
    <div class="ghdr">הגדרה חד־פעמית באפליקציית קיצורים</div>
    <div class="group"><ol class="steps">
      <li>אוטומציה ← <b>+</b> ← <b>ארנק</b> (Wallet). בחר את הכרטיסים, סמן <b>הפעלה מיידית</b> (Run Immediately) ולחץ הבא.</li>
      <li>בחר <b>אוטומציה ריקה חדשה</b> והוסף את הפעולה <b>טקסט</b> (Text).</li>
      <li>בתיבת הטקסט כתוב <code>HAKESEF|</code> ואז הוסף את המשתנה <b>תאריך נוכחי</b> (Current Date), נגע בו ובחר תבנית <b>ISO 8601</b>.</li>
      <li>המשך באותה שורה: <code>|</code> ומשתנה <b>קלט קיצור</b> (Shortcut Input) ← <b>סכום</b> (Amount), <code>|</code> וקלט קיצור ← <b>בית עסק</b> (Merchant), <code>|</code> וקלט קיצור ← <b>כרטיס</b> (Card).</li>
      <li>הוסף את הפעולה <b>הוספה לקובץ טקסט</b> (Append to Text File). בנתיב כתוב <code>hakesef-applepay.txt</code> והשאר את <b>שורה חדשה</b> (Make New Line) מסומן. שמור.</li>
    </ol></div>
    <div class="foot">השורה צריכה להיראות כך: <span dir="ltr">HAKESEF|תאריך|סכום|בית עסק|כרטיס</span>. אם האוטומציה לא רצה, ודא שלאפליקציית ארנק מותר להשתמש בנתונים סלולריים (הגדרות ← אפליקציות ← ארנק).</div>
    <div class="ghdr">סנכרון</div>
    <div class="group"><button class="row" id="apSync"><span style="color:var(--tint)">סנכרון תשלומים עכשיו</span></button>
      <button class="row" id="apPend"><span class="lbl">ממתינים לקטגוריה</span><span class="val num">${S.pending.length}</span><span class="chev">${UI_ICON.chev}</span></button>
      <div class="row"><span class="lbl">בתי עסק מוכרים</span><span class="val num">${nm}</span></div>
      ${S.meta.apLast?`<div class="row"><span class="lbl">סנכרון אחרון</span><span class="val">${new Date(S.meta.apLast).toLocaleString('he-IL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div>`:''}</div>
    <div class="foot">בכל סנכרון בוחרים את הקובץ ב-iCloud Drive ← Shortcuts. תשלומים שכבר יובאו לא ייובאו שוב, ואין צורך למחוק את הקובץ. אחרי הסנכרון הראשון יופיע כפתור כרטיס בראש המסך.</div>
    ${nm?`<div class="gap"></div><div class="group"><button class="row" id="apReset"><span class="danger">איפוס בתי העסק המוכרים</span></button></div>`:''}`);
  const el=s.el;
  el.querySelector('[data-close]').onclick=s.close;
  el.querySelector('#apSync').onclick=()=>{s.close();$('#fileAP').click()};
  el.querySelector('#apPend').onclick=()=>{s.close();openPending()};
  const r=el.querySelector('#apReset');if(r)r.onclick=async()=>{const ok=await ask('לאפס את בתי העסק?','תשלומים הבאים יחכו לסיווג עד שתבחר קטגוריה שוב.',[{label:'איפוס',val:true,cls:'danger'},{label:'ביטול',val:false}]);if(ok){S.meta.merchants={};save();s.close();openAPSetup()}};
}

/* ---------- wiring ---------- */
function wire(){
  $('#prevBtn').onclick=()=>shift(-1);$('#nextBtn').onclick=()=>shift(1);
  $('#todayBtn').onclick=()=>{UI.anchor=today();UI.open=null;render()};
  $('#periods').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;UI.mode=b.dataset.m;UI.open=null;render()};
  $('#views').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;UI.view=b.dataset.v;render()};
  $('#center').onclick=()=>{UI.ring=UI.ring==='exp'?'inc':'exp';UI.open=null;render()};
  $('#bubbles').onclick=e=>{const b=e.target.closest('.bub');if(!b)return;
    if(b.dataset.more)pickCategory(UI.ring,id=>openEditor({type:UI.ring,catId:id}));else openEditor({type:UI.ring,catId:b.dataset.cat})};
  $('#list').onclick=e=>{
    const o=e.target.closest('[data-open]');if(o){UI.open=UI.open===o.dataset.open?null:o.dataset.open;renderList(periodTxs());return}
    const t=e.target.closest('[data-tx]');if(t){const tx=S.txs.find(x=>x.id===t.dataset.tx);if(tx)openEditor({tx})}
  };
  $('#search').oninput=e=>{UI.q=e.target.value;renderList(periodTxs())};
  $('#addExp').onclick=()=>openEditor({type:'exp'});
  $('#addInc').onclick=()=>openEditor({type:'inc'});
  $('#menuBtn').onclick=openMenu;
  $('#fileCsv').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importCSV(f)};
  $('#fileJson').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)restoreJSON(f)};
  $('#plabel').onclick=openPicker;
  $('#recBtn').onclick=openRecurring;
  $('#apBtn').onclick=()=>$('#fileAP').click();
  $('#fileAP').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)syncAP(f)};
  $('#chips').addEventListener('click',e=>{const c=e.target.closest('[data-q]');if(!c||chipLong){chipLong=false;return}quickAdd(QUICK[+c.dataset.q])});
  let lpT=null;
  $('#chips').addEventListener('touchstart',e=>{const c=e.target.closest('[data-q]');if(!c)return;lpT=setTimeout(async()=>{chipLong=true;const o=QUICK[+c.dataset.q];
    const ok=await ask('להסתיר את הקיצור?',`${o.n||cat(o.c).name}, ${money(o.a)}`,[{label:'הסתרה',val:true,cls:'danger'},{label:'ביטול',val:false}]);
    if(ok){(S.meta.hiddenQuick=S.meta.hiddenQuick||[]).push(o.k);save();renderChips()}},550)},{passive:true});
  ['touchend','touchmove','touchcancel'].forEach(ev=>$('#chips').addEventListener(ev,()=>clearTimeout(lpT),{passive:true}));
  window.addEventListener('resize',fitPad);
  setupSwipe();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const n=postDue();if(n){render();toast(`נרשמו ${n} תנועות קבועות`)}}});
}
(async()=>{
  const moved=await load();
  if(lk()?.on)showLock();
  const posted=postDue();
  wire();render();
  if(posted)setTimeout(()=>toast(`נרשמו ${posted} תנועות קבועות`),moved?2600:0);
  if(moved)toast(`נוספו קטגוריות טרמפים, ו-${moved} תנועות עברו אליהן`);
  if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(_){}}
})();
</script>
